name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Publish self-contained application
        shell: pwsh
        run: dotnet publish .\osu_patterncopier.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o .\publish

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path .\publish\* -DestinationPath .\osu_patterncopier-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME .\osu_patterncopier-$env:GITHUB_REF_NAME-win-x64.zip --title "osu_patterncopier $env:GITHUB_REF_NAME" --generate-notes
